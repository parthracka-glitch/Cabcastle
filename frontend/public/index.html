          (function () {
            var isIgnorable = function (msg) {
              if (!msg) return false;
              var str = typeof msg === "string" ? msg : (msg.message || (msg.reason && msg.reason.message) || msg.toString?.() || "");

            // 1. Intercept standard error events
            window.addEventListener("error", function (e) {
              if (isIgnorable(e.message) || isIgnorable(e.error)) {

            window.onerror = function (message, source, lineno, colno, error) {
              if (isIgnorable(message) || isIgnorable(error)) {
                return true;

              }

            // 4. Wrap ResizeObserver with requestAnimationFrame to prevent notification loops

                  });
                });
              };
              window.ResizeObserver.prototype = NativeRO.prototype;
            }

                };
                return origAddEventListener.call(this, type, wrapped, options);
              }
              return origAddEventListener.apply(this, arguments);
            };
